name: Deploy Data API Worker

# The API Worker deploys independently of the Pages site, mirroring the
# site's main/dev split:
#   push to main → production  (nczoning-api        @ api.nczoning.net)
#   push to dev  → staging     (nczoning-api-staging @ api-dev.nczoning.net)
# Path-filtered to worker/**, so unrelated pushes never redeploy the API.

on:
  push:
    branches: [main, dev]
    paths: ['worker/**', '.github/workflows/deploy-api.yml']
  # Manual / automated redeploy. The monitor-api-health self-heal dispatches
  # this (per ref) to revive a wedged refresh cron — a redeploy re-registers the
  # Cron Trigger (see #849). Env is chosen by the ref, exactly as for push:
  # dispatch on main → production, on dev → staging.
  workflow_dispatch:

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install
        run: npm ci
        working-directory: worker

      - name: Test (gate)
        run: npm test
        working-directory: worker

      - name: Deploy production
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker

      - name: Deploy staging
        if: github.ref == 'refs/heads/dev'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          environment: staging
