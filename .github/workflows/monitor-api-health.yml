name: Monitor Data API Health

# The site consumes /v1 with a client-side fallback (B7), and in-game mods
# (the API's primary consumer) have NO fallback. So a silent website fallback
# would mask an API outage. This is the independent alarm: it hits the live API
# on a schedule and pings Discord (+ fails the run) when it isn't serving.

on:
  schedule:
    - cron: '*/15 * * * *'   # independent uptime probe, every 15 min (need not match the dataset cron)
  workflow_dispatch:          # manual trigger (testing / on demand)

permissions:
  contents: read
  # write (implies read): read this workflow's own history for the recovery edge,
  # read deploy-api.yml history for the self-heal budget, and dispatch it to
  # redeploy a wedged cron (#849 Phase 2). workflow_dispatch fires even from
  # GITHUB_TOKEN, so no PAT is needed.
  actions: write

# A slow/queued run shouldn't stack; keep only the latest.
concurrency:
  group: monitor-api-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # The previous completed run's conclusion is the last known health state:
      # the probe exits 1 on an outage (→ failure) and 0 when serving
      # (→ success). Filter to success/failure so a cancelled (concurrency) or
      # in-progress run never counts. The most recent match is "last time".
      - name: Read previous health state
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh run list --workflow monitor-api-health.yml \
            --status completed --limit 20 \
            --json conclusion \
            --jq '[.[] | select(.conclusion == "success" or .conclusion == "failure")][0].conclusion // ""')
          echo "previous conclusion: '${prev:-none}'"
          if [ "$prev" = "failure" ]; then
            echo "prev_outage=true" >> "$GITHUB_OUTPUT"
          else
            echo "prev_outage=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe /v1, alert, and self-heal a wedged cron
        env:
          # Alerts go to the Worker, which records them in the `alerts` table
          # and forwards to the map-alerts channel. Posting to Discord from here
          # would leave the dashboard with no history of anything this monitor
          # said. The Worker holds the webhook now; this job holds only the
          # ingest secret.
          #
          # This is a GitHub Actions secret. The Worker's copy is a Cloudflare
          # Worker secret (`npx wrangler secret put ALERTS_INGEST_SECRET`), a
          # separate store: setting one does not set the other.
          ALERTS_INGEST_SECRET: ${{ secrets.ALERTS_INGEST_SECRET }}
          # Was the API down last run? A clean run after a down one is the
          # recovery edge → the script posts a green all-clear exactly once.
          API_HEALTH_PREV_OUTAGE: ${{ steps.prev.outputs.prev_outage }}
          # Self-heal: on a wedged cron, dispatch deploy-api.yml (per env) to
          # revive it, budget-guarded (#849 Phase 2). GH_TOKEN authorises the
          # dispatch + the budget read; GITHUB_REPOSITORY/GITHUB_API_URL are set
          # by Actions automatically.
          API_HEALTH_SELF_HEAL: 'true'
          GH_TOKEN: ${{ github.token }}
          # Production only. api-dev was dropped when staging lost its cron: a
          # cronless Worker's heartbeat never advances, so it would report an
          # ever-growing refresh_age_seconds, page this channel every 15 min and
          # trip the self-heal redeploy in a loop. Staging is refreshed on demand
          # (see worker/wrangler.jsonc) and the dev site now reads production, so
          # there is nothing there to monitor. The script retries 3× before
          # declaring an outage, so a momentary deploy blip won't page.
          API_HEALTH_TARGETS: 'https://api.nczoning.net'
        run: node scripts/monitor_api_health.js
