name: Validate Mod Data

# The `validate-json` job below is a REQUIRED status check on main's ruleset
# (13449449). Renaming the job, or deleting this workflow, leaves every future
# PR waiting on a check that can never report. Keep the job id even when it has
# nothing left to validate.
#
# What it used to do: build mods.json from data/locations/*.json, run ajv
# against mods.schema.json, and check tags. All three went at Phase 6 with the
# files they read. Location data is in D1 and is validated on the write path by
# worker/src/validate.js, which is where a bad value is now refused.
#
# mods.schema.json survives as the cross-check that worker/test/validate.test.js
# runs ajv against, so it is still checked, by the Worker suite rather than here.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm no location data has come back
        run: |
          if [ -e data/locations ]; then
            echo "::error::data/locations/ is back. The registry is D1; see docs/architecture.md."
            exit 1
          fi
          if [ -e scripts/build_mods.js ]; then
            echo "::error::build_mods.js is back. mods.json is not built or read any more."
            exit 1
          fi
          echo "No re-added location files or build script."
