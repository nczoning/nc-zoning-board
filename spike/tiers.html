<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NCZ spike: distance tiers</title>
<!--
  Eighteen buildings, each drawn at whichever tier its distance from the camera
  earns, so the question this answers is not what a tier costs (geometry.html
  measured that) but whether a building CHANGING tier is something you notice.

    near   the real kit, instanced. One draw call per unique mesh per building.
    mid    the same placements merged at a coarser LOD. One draw call.
    far    the hull boxes the current pipeline ships. One draw call.

  The kit library is shared across every building and the merged buffers are
  not. That asymmetry is the design: 37,343 meshes cover the whole city, while
  merged geometry is per building by construction.

  Tier boundaries are adjustable live, because the right ones are a judgement
  about when the change stops being visible, and that is not a number anyone
  can derive.

  Data: scripts/spike_region.js. CET (x, y, z) -> world (x, z, -y).
-->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0a192f; color: #00f0ff; font: 13px/1.6 ui-monospace, monospace; overflow: hidden; }
  #ui { position: fixed; top: 12px; left: 12px; z-index: 10; background: rgba(10,25,47,.92);
        border: 1px solid #00f0ff; border-radius: 4px; padding: 10px 14px; }
  #hud { white-space: pre; margin-top: 8px; }
  .row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .row span.label { opacity: .6; width: 62px; }
  button { font: inherit; color: #00f0ff; background: transparent; border: 1px solid #2a4a6b;
           border-radius: 3px; padding: 2px 10px; cursor: pointer; }
  button:hover { border-color: #00f0ff; }
  button[aria-pressed="true"] { background: #00f0ff; color: #0a192f; }
  #err { position: fixed; inset: 20% 10% auto; z-index: 20; color: #ff2d3a; white-space: pre-wrap; }
</style>
<script type="importmap">
{ "imports": {
  "three":         "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.webgpu.min.js",
  "three/webgpu":  "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.webgpu.min.js",
  "three/tsl":     "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.tsl.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui">
  <div class="row"><span class="label">tier</span><span id="modeBtns"></span></div>
  <div class="row"><span class="label">colour</span><span id="colBtns"></span></div>
  <div id="hud">loading…</div>
</div>
<div id="err"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const params = new URLSearchParams(location.search);
const hashParams = new URLSearchParams(location.hash.replace(/^#/, ''));
const NAME = params.get('r') || hashParams.get('r') || 'region-city_center';

const hud = document.getElementById('hud');
const errBox = document.getElementById('err');
const fail = (e) => { errBox.textContent = String(e && e.stack || e); console.error(e); };
window.addEventListener('error', (e) => fail(e.error || e.message));

const meta = await fetch(`../data/${NAME}.json`).then(r => {
  if (!r.ok) throw new Error(`no ../data/${NAME}.json: run scripts/spike_region.js first`);
  return r.json();
}).catch(fail);
const buf = await fetch(`../data/${NAME}.bin`).then(r => r.arrayBuffer());

const L = meta.layout;
const kitData = new Float32Array(buf, L.kit.byteOffset, L.kit.byteLength / 4);

const renderer = new THREE.WebGPURenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a192f, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 1, 40000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minPolarAngle = 0;
controls.maxPolarAngle = Math.PI * 0.39;
controls.minDistance = 200;
controls.maxDistance = 15000;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const cetPos = (x, y, z) => new THREE.Vector3(x, z, -y);
const cetQuat = (x, y, z, w) => new THREE.Quaternion(x, z, -y, w);

// One material set for the whole scene, and a second set that paints by tier.
// Seeing WHICH tier a building is on matters as much as seeing the geometry:
// a transition that is invisible in the neutral colours is the goal, and the
// only way to know it happened is to be able to turn the colours on.
const NEUTRAL = new THREE.MeshBasicNodeMaterial({ color: 0x2a4a6b, side: THREE.DoubleSide });
const TIER_MAT = [
  new THREE.MeshBasicNodeMaterial({ color: 0x37d67a, side: THREE.DoubleSide }),  // near
  new THREE.MeshBasicNodeMaterial({ color: 0xffb300, side: THREE.DoubleSide }),  // mid
  new THREE.MeshBasicNodeMaterial({ color: 0xff2d3a, side: THREE.DoubleSide }),  // far
];

// ── Build ─────────────────────────────────────────────────────────────────
const dummy = new THREE.Object3D();
const kitGeo = new Map();     // mesh index -> BufferGeometry, shared by every building
function geoFor(mi) {
  if (kitGeo.has(mi)) return kitGeo.get(mi);
  const m = meta.meshes[mi];
  const tris = kitData.subarray(m.floatOffset, m.floatOffset + m.triangles * 9);
  const pos = new Float32Array(tris.length);
  for (let v = 0; v < tris.length; v += 3) {
    pos[v] = tris[v]; pos[v + 1] = tris[v + 2]; pos[v + 2] = -tris[v + 1];
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.computeVertexNormals();
  kitGeo.set(mi, g);
  return g;
}

const builds = [];
let nearTris = 0, midTris = 0, farTris = 0, nearDraws = 0;

for (const b of meta.buildings) {
  const centre = cetPos(
    (b.bounds.min[0] + b.bounds.max[0]) / 2,
    (b.bounds.min[1] + b.bounds.max[1]) / 2,
    (b.bounds.min[2] + b.bounds.max[2]) / 2,
  );
  const radius = 0.5 * Math.hypot(
    b.bounds.max[0] - b.bounds.min[0],
    b.bounds.max[1] - b.bounds.min[1],
    b.bounds.max[2] - b.bounds.min[2],
  );

  // near: instanced kit, grouped by mesh WITHIN this building. A production
  // renderer would group across buildings to cut the draw calls; per building
  // is what lets a single building switch tier on its own.
  const inst = new Float32Array(buf, L.instances.byteOffset + b.instances.byteOffset, b.instances.count * 11);
  const byMesh = new Map();
  for (let i = 0; i < b.instances.count; i++) {
    const mi = inst[i * 11 + 10];
    if (!byMesh.has(mi)) byMesh.set(mi, []);
    byMesh.get(mi).push(i);
  }
  const near = new THREE.Group();
  for (const [mi, list] of byMesh) {
    const g = geoFor(mi);
    const im = new THREE.InstancedMesh(g, NEUTRAL, list.length);
    im.frustumCulled = false;
    list.forEach((idx, k) => {
      const o = idx * 11;
      dummy.position.copy(cetPos(inst[o], inst[o + 1], inst[o + 2]));
      dummy.quaternion.copy(cetQuat(inst[o + 3], inst[o + 4], inst[o + 5], inst[o + 6]));
      dummy.scale.set(inst[o + 7], inst[o + 9], inst[o + 8]);
      dummy.updateMatrix();
      im.setMatrixAt(k, dummy.matrix);
    });
    im.instanceMatrix.needsUpdate = true;
    near.add(im);
    nearTris += (g.getAttribute('position').count / 3) * list.length;
    nearDraws++;
  }

  // mid: one merged buffer.
  const mergedSrc = new Float32Array(buf, L.merged.byteOffset + b.merged.byteOffset, b.merged.triangles * 9);
  const mp = new Float32Array(mergedSrc.length);
  for (let v = 0; v < mergedSrc.length; v += 3) {
    mp[v] = mergedSrc[v]; mp[v + 1] = mergedSrc[v + 2]; mp[v + 2] = -mergedSrc[v + 1];
  }
  const mg = new THREE.BufferGeometry();
  mg.setAttribute('position', new THREE.BufferAttribute(mp, 3));
  mg.computeVertexNormals();
  const mid = new THREE.Mesh(mg, NEUTRAL);
  mid.frustumCulled = false;
  midTris += b.merged.triangles;

  // far: the hull boxes for the same volume.
  const bd = new Float32Array(buf, L.boxes.byteOffset + b.boxes.byteOffset, b.boxes.count * 10);
  const far = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), NEUTRAL, Math.max(1, b.boxes.count));
  far.frustumCulled = false;
  for (let i = 0; i < b.boxes.count; i++) {
    const o = i * 10;
    dummy.position.copy(cetPos(bd[o], bd[o + 1], bd[o + 2]));
    dummy.quaternion.copy(cetQuat(bd[o + 6], bd[o + 7], bd[o + 8], bd[o + 9]));
    dummy.scale.set(bd[o + 3] * 2, bd[o + 5] * 2, bd[o + 4] * 2);
    dummy.updateMatrix();
    far.setMatrixAt(i, dummy.matrix);
  }
  far.instanceMatrix.needsUpdate = true;
  farTris += b.boxes.count * 12;

  scene.add(near, mid, far);
  builds.push({ b, centre, radius, near, mid, far, tier: -1 });
}

// ── Tier selection ────────────────────────────────────────────────────────
// Distance to the building's SURFACE, not its centre: a 180 m tower and a 20 m
// shopfront at the same centre distance do not deserve the same tier, and
// subtracting the radius is the cheap version of asking how big it looks.
const MODES = ['auto', 'near', 'mid', 'far'];
let mode = 0, colour = 0;
let nearMax = 350, midMax = 1200;

function tierFor(bld) {
  if (mode !== 0) return mode - 1;
  const d = Math.max(0, camera.position.distanceTo(bld.centre) - bld.radius);
  return d < nearMax ? 0 : d < midMax ? 1 : 2;
}

const counts = [0, 0, 0];
let lastColour = -1;

/** Repaint one building to match its tier and the colour mode. */
function paintBuilding(bld) {
  const m = colour === 0 ? NEUTRAL : TIER_MAT[bld.tier];
  bld.near.traverse(o => { if (o.isMesh) o.material = m; });
  bld.mid.material = m;
  bld.far.material = m;
}

function applyTiers() {
  counts[0] = counts[1] = counts[2] = 0;
  const colourChanged = colour !== lastColour;
  for (const bld of builds) {
    const t = tierFor(bld);
    counts[t]++;
    const tierChanged = t !== bld.tier;
    if (!tierChanged && !colourChanged) continue;
    bld.tier = t;
    bld.near.visible = t === 0;
    bld.mid.visible = t === 1;
    bld.far.visible = t === 2;
    // Only the buildings that actually changed. Walking every building's
    // InstancedMeshes every frame to reassign a material it already has is
    // work proportional to the whole region, done sixty times a second.
    paintBuilding(bld);
  }
  lastColour = colour;
}

function mkButtons(host, items, get, set) {
  host.innerHTML = '';
  items.forEach((it, i) => {
    const b = document.createElement('button');
    b.textContent = it;
    b.addEventListener('click', () => { set(i); paint(); });
    host.appendChild(b);
  });
}
const modeHost = document.getElementById('modeBtns');
const colHost = document.getElementById('colBtns');
mkButtons(modeHost, MODES, () => mode, (i) => { mode = i; });
mkButtons(colHost, ['neutral', 'by tier'], () => colour, (i) => { colour = i; });
function paint() {
  [...modeHost.children].forEach((b, i) => b.setAttribute('aria-pressed', i === mode));
  [...colHost.children].forEach((b, i) => b.setAttribute('aria-pressed', i === colour));
}

addEventListener('keydown', (e) => {
  if (e.key === '1') mode = 0; else if (e.key === '2') mode = 1;
  else if (e.key === '3') mode = 2; else if (e.key === '4') mode = 3;
  else if (e.key === 'c' || e.key === 'C') colour = 1 - colour;
  else if (e.key === '[') nearMax = Math.max(50, nearMax - 50);
  else if (e.key === ']') nearMax += 50;
  else if (e.key === ';') midMax = Math.max(nearMax + 50, midMax - 100);
  else if (e.key === "'") midMax += 100;
  else return;
  paint();
});

// ── Warm the pipelines before anything is hidden ──────────────────────────
// Switching a building to a tier whose geometry has never been drawn is when
// WebGPU compiles that pipeline and uploads those buffers, and it does it
// inside the frame: the cost lands as a hitch exactly at the transition, and
// then never again, which is why it "settles". A tier system whose every
// boundary crossing stutters once is not fixed by the stutter being rare.
//
// Compiling with EVERY tier of every building visible pays all of it up front,
// where a loading pause is expected and a hitch is not.
hud.textContent = 'compiling pipelines…';
for (const bld of builds) { bld.near.visible = true; bld.mid.visible = true; bld.far.visible = true; }
if (renderer.compileAsync) {
  await renderer.compileAsync(scene, camera);
} else {
  renderer.render(scene, camera);   // fallback: one warm frame with everything on
}
for (const bld of builds) { bld.tier = -1; }

// Frame the region.
{
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const bld of builds) {
    x0 = Math.min(x0, bld.centre.x); x1 = Math.max(x1, bld.centre.x);
    y0 = Math.min(y0, bld.centre.z); y1 = Math.max(y1, bld.centre.z);
  }
  const c = new THREE.Vector3((x0 + x1) / 2, 60, (y0 + y1) / 2);
  controls.target.copy(c);
  camera.position.copy(c).add(new THREE.Vector3(0, 900, 1100));
  controls.update();
}
paint();

const times = [];
let last = performance.now();
renderer.setAnimationLoop(() => {
  const now = performance.now();
  times.push(now - last); if (times.length > 60) times.shift();
  last = now;
  controls.update();
  applyTiers();
  renderer.render(scene, camera);

  const ms = times.reduce((a, b) => a + b, 0) / times.length;
  const info = renderer.info.render;
  hud.textContent =
    `${meta.district}   ${meta.buildings.length} buildings   ${MODES[mode]}\n` +
    `1-4 tier   C colour   [ ] near ${nearMax}m   ; ' mid ${midMax}m\n\n` +
    `frame      ${ms.toFixed(1)} ms  (${(1000 / ms).toFixed(0)} fps)\n` +
    `draw calls ${info.drawCalls}\n` +
    `triangles  ${info.triangles.toLocaleString()}\n\n` +
    `on screen  near ${counts[0]}   mid ${counts[1]}   far ${counts[2]}\n\n` +
    `if every building were:\n` +
    `  near     ${Math.round(nearTris).toLocaleString()} tris over ${nearDraws} draws\n` +
    `  mid      ${midTris.toLocaleString()} tris over ${builds.length} draws\n` +
    `  far      ${farTris.toLocaleString()} tris over ${builds.length} draws\n` +
    `kit        ${meta.totals.uniqueMeshes} meshes shared, ${meta.totals.kitTriangles.toLocaleString()} triangles`;
});
</script>
</body>
</html>
