<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NCZ spike: one building, three representations</title>
<!--
  Renders ONE sector|prefab assembly so the choice between representations is
  made by looking and by measuring, not by argument.

  Two axes, swapped in place:

    LOD          0 / 1 / 2, the levels CDPR authored inside each .mesh. The
                 original export took LOD0 only, because UncookMesh's
                 lodFilter argument was never passed.
    visibility   every placement, or only those exposure.js says a camera the
                 map allows can reach.

  and three representations of whichever build is loaded:

    1 kit      the real meshes, instanced. One draw call per unique mesh.
    2 merged   the same triangles baked to world space. One draw call.
    3 boxes    what the current pipeline ships for the same volume.

  The camera pose survives a swap. Comparing two builds is only meaningful
  from the same angle, and a reload throws the angle away.

  Data comes from scripts/spike_assembly.js. CET (x, y, z) maps to world
  (x, z, -y), matching three-scene.js.
-->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0a192f; color: #00f0ff; font: 13px/1.6 ui-monospace, monospace; overflow: hidden; }
  #ui { position: fixed; top: 12px; left: 12px; z-index: 10; background: rgba(10,25,47,.9);
        border: 1px solid #00f0ff; border-radius: 4px; padding: 10px 14px; }
  #hud { white-space: pre; margin-top: 8px; }
  .row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .row span { opacity: .6; width: 76px; }
  button { font: inherit; color: #00f0ff; background: transparent; border: 1px solid #2a4a6b;
           border-radius: 3px; padding: 2px 10px; cursor: pointer; }
  button:hover { border-color: #00f0ff; }
  button[aria-pressed="true"] { background: #00f0ff; color: #0a192f; border-color: #00f0ff; }
  button:disabled { opacity: .3; cursor: default; }
  #err { position: fixed; inset: 20% 10% auto; z-index: 20; color: #ff2d3a; white-space: pre-wrap; }
</style>
<script type="importmap">
{ "imports": {
  "three":         "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.webgpu.min.js",
  "three/webgpu":  "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.webgpu.min.js",
  "three/tsl":     "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.tsl.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui">
  <div class="row"><span>lod</span><span id="lodBtns"></span></div>
  <div class="row"><span>placements</span><span id="visBtns"></span></div>
  <div class="row"><span>draw</span><span id="modeBtns"></span></div>
  <div id="hud">loading…</div>
</div>
<div id="err"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const params = new URLSearchParams(location.search);
const hashParams = new URLSearchParams(location.hash.replace(/^#/, ''));
const BASE = params.get('b') || hashParams.get('b') || 'spike--8_0_0_L2-298522';
// Strip any suffix off the name given, so ?b= can point at a sibling building
// and the two axes still resolve.
const STEM = BASE.replace(/-all$/, '').replace(/-lod\d+$/, '').replace(/-all-lod\d+$/, '');

const hud = document.getElementById('hud');
const errBox = document.getElementById('err');
const fail = (e) => { errBox.textContent = String(e && e.stack || e); console.error(e); };
window.addEventListener('error', (e) => fail(e.error || e.message));

// LOD is named by the game's MASK (1, 2, 4) and by the level people say.
const LODS = [
  { mask: 0, label: 'LOD0', suffix: '' },
  { mask: 2, label: 'LOD1', suffix: '-lod2' },
  { mask: 4, label: 'LOD2', suffix: '-lod4' },
];
const VIS = [
  { label: 'visible only', suffix: '' },
  { label: 'all', suffix: '-all' },
];
const MODES = ['kit', 'merged', 'boxes'];

let lodIdx = 0, visIdx = 0, mode = 0, outlines = true;

// ── Scene ─────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGPURenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a192f, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 1, 20000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
// The map's own limits, so the spike is judged from poses the product allows.
controls.minPolarAngle = 0;
controls.maxPolarAngle = Math.PI * 0.39;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// A kit panel is a single-sided quad wound toward the room it was authored
// for, so front-face culling opens holes from outside. The game never puts a
// camera out there; a map camera is out there by definition.
const fillMat = new THREE.MeshBasicNodeMaterial({ color: 0x2a4a6b, side: THREE.DoubleSide });
const lineMat = new THREE.LineBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.55 });

const cetPos = (x, y, z) => new THREE.Vector3(x, z, -y);
const cetQuat = (x, y, z, w) => new THREE.Quaternion(x, z, -y, w);

// ── Build ─────────────────────────────────────────────────────────────────
const cache = new Map();     // name -> { meta, buf }
let current = null;          // { root, meta, kitGroup, kitEdges, mergedMesh, boxMesh, boxEdges }

async function fetchBuild(name) {
  if (cache.has(name)) return cache.get(name);
  const meta = await fetch(`../data/${name}.json`).then(r => {
    if (!r.ok) throw new Error(`no ../data/${name}.json\nrun: node scripts/spike_assembly.js city_center -8_0_0_L2 298522 [--lod N] [--keep-hidden]`);
    return r.json();
  });
  const buf = await fetch(`../data/${name}.bin`).then(r => r.arrayBuffer());
  const entry = { meta, buf };
  cache.set(name, entry);
  return entry;
}

/** Free the GPU buffers of a build before dropping it. */
function disposeCurrent() {
  if (!current) return;
  current.root.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
  });
  scene.remove(current.root);
  current = null;
}

function buildScene(meta, buf) {
  const L = meta.layout;
  const kitGeoData = new Float32Array(buf, L.kit.byteOffset, L.kit.byteLength / 4);
  const instData = new Float32Array(buf, L.instances.byteOffset, L.instances.byteLength / 4);
  const mergedPos = new Float32Array(buf, L.merged.byteOffset, L.merged.byteLength / 4);
  const boxData = new Float32Array(buf, L.boxes.byteOffset, L.boxes.byteLength / 4);

  const root = new THREE.Group();
  const dummy = new THREE.Object3D();

  // 1. Kit: one InstancedMesh per unique mesh.
  const kitGroup = new THREE.Group();
  const byMesh = new Map();
  const nInst = instData.length / 11;
  for (let i = 0; i < nInst; i++) {
    const mi = instData[i * 11 + 10];
    if (!byMesh.has(mi)) byMesh.set(mi, []);
    byMesh.get(mi).push(i);
  }

  // Crease edges are built once per unique mesh and instance-transformed into
  // one buffer: one LineSegments per placement would be thousands of draw
  // calls and would measure the wrong thing.
  const edgeVerts = [];
  for (const [mi, list] of byMesh) {
    const m = meta.meshes[mi];
    const tris = kitGeoData.subarray(m.floatOffset, m.floatOffset + m.triangles * 9);
    const pos = new Float32Array(tris.length);
    for (let v = 0; v < tris.length; v += 3) {
      pos[v] = tris[v]; pos[v + 1] = tris[v + 2]; pos[v + 2] = -tris[v + 1];
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.computeVertexNormals();

    const im = new THREE.InstancedMesh(g, fillMat, list.length);
    im.frustumCulled = false;
    const edges = new THREE.EdgesGeometry(g, 30);
    const ep = edges.getAttribute('position');
    const v = new THREE.Vector3();

    list.forEach((idx, k) => {
      const o = idx * 11;
      dummy.position.copy(cetPos(instData[o], instData[o + 1], instData[o + 2]));
      dummy.quaternion.copy(cetQuat(instData[o + 3], instData[o + 4], instData[o + 5], instData[o + 6]));
      dummy.scale.set(instData[o + 7], instData[o + 9], instData[o + 8]);
      dummy.updateMatrix();
      im.setMatrixAt(k, dummy.matrix);
      for (let e = 0; e < ep.count; e++) {
        v.fromBufferAttribute(ep, e).applyMatrix4(dummy.matrix);
        edgeVerts.push(v.x, v.y, v.z);
      }
    });
    im.instanceMatrix.needsUpdate = true;
    kitGroup.add(im);
    edges.dispose();
  }
  const edgeGeo = new THREE.BufferGeometry();
  edgeGeo.setAttribute('position', new THREE.BufferAttribute(Float32Array.from(edgeVerts), 3));
  const kitEdges = new THREE.LineSegments(edgeGeo, lineMat);
  kitEdges.frustumCulled = false;
  kitGroup.add(kitEdges);
  root.add(kitGroup);

  // 2. Merged: the same triangles, one draw call.
  const mergedGeo = new THREE.BufferGeometry();
  {
    const p = new Float32Array(mergedPos.length);
    for (let v = 0; v < mergedPos.length; v += 3) {
      p[v] = mergedPos[v]; p[v + 1] = mergedPos[v + 2]; p[v + 2] = -mergedPos[v + 1];
    }
    mergedGeo.setAttribute('position', new THREE.BufferAttribute(p, 3));
    mergedGeo.computeVertexNormals();
  }
  const mergedMesh = new THREE.Mesh(mergedGeo, fillMat);
  mergedMesh.frustumCulled = false;
  root.add(mergedMesh);

  // 3. Boxes: the current representation.
  const nBox = boxData.length / 10;
  const boxMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), fillMat, Math.max(1, nBox));
  boxMesh.frustumCulled = false;
  const boxEdgeVerts = [];
  {
    const unit = new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1), 30);
    const up = unit.getAttribute('position');
    const v = new THREE.Vector3();
    for (let i = 0; i < nBox; i++) {
      const o = i * 10;
      dummy.position.copy(cetPos(boxData[o], boxData[o + 1], boxData[o + 2]));
      dummy.quaternion.copy(cetQuat(boxData[o + 6], boxData[o + 7], boxData[o + 8], boxData[o + 9]));
      dummy.scale.set(boxData[o + 3] * 2, boxData[o + 5] * 2, boxData[o + 4] * 2);
      dummy.updateMatrix();
      boxMesh.setMatrixAt(i, dummy.matrix);
      for (let e = 0; e < up.count; e++) {
        v.fromBufferAttribute(up, e).applyMatrix4(dummy.matrix);
        boxEdgeVerts.push(v.x, v.y, v.z);
      }
    }
    boxMesh.instanceMatrix.needsUpdate = true;
    unit.dispose();
  }
  const boxEdgeGeo = new THREE.BufferGeometry();
  boxEdgeGeo.setAttribute('position', new THREE.BufferAttribute(Float32Array.from(boxEdgeVerts), 3));
  const boxEdges = new THREE.LineSegments(boxEdgeGeo, lineMat);
  boxEdges.frustumCulled = false;
  root.add(boxMesh, boxEdges);

  scene.add(root);
  return { root, meta, kitGroup, kitEdges, mergedMesh, boxMesh, boxEdges };
}

function applyMode() {
  if (!current) return;
  const m = MODES[mode];
  current.kitGroup.visible = m === 'kit';
  current.kitEdges.visible = m === 'kit' && outlines;
  current.mergedMesh.visible = m === 'merged';
  current.boxMesh.visible = m === 'boxes';
  current.boxEdges.visible = m === 'boxes' && outlines;
  paintButtons();
}

let loading = false;
async function load(first = false) {
  if (loading) return;
  loading = true;
  paintButtons();
  const name = STEM + VIS[visIdx].suffix + LODS[lodIdx].suffix;
  try {
    const { meta, buf } = await fetchBuild(name);
    // The camera is NOT reset. Two builds are only comparable from the same
    // pose, and the whole point of swapping in place is to keep it.
    disposeCurrent();
    current = buildScene(meta, buf);
    if (first) {
      const c = cetPos(
        (meta.bounds.min[0] + meta.bounds.max[0]) / 2,
        (meta.bounds.min[1] + meta.bounds.max[1]) / 2,
        (meta.bounds.min[2] + meta.bounds.max[2]) / 2,
      );
      camera.position.copy(c).add(new THREE.Vector3(0, 190, 260));
      controls.target.copy(c);
      controls.update();
    }
    errBox.textContent = '';
  } catch (e) {
    fail(e);
  }
  loading = false;
  applyMode();
}

// ── Buttons ───────────────────────────────────────────────────────────────
function mkButtons(host, items, get, set) {
  host.innerHTML = '';
  items.forEach((it, i) => {
    const b = document.createElement('button');
    b.textContent = it.label ?? it;
    b.addEventListener('click', () => { if (get() !== i) { set(i); } });
    host.appendChild(b);
  });
}
const lodHost = document.getElementById('lodBtns');
const visHost = document.getElementById('visBtns');
const modeHost = document.getElementById('modeBtns');
mkButtons(lodHost, LODS, () => lodIdx, (i) => { lodIdx = i; load(); });
mkButtons(visHost, VIS, () => visIdx, (i) => { visIdx = i; load(); });
mkButtons(modeHost, MODES.map(m => ({ label: m })), () => mode, (i) => { mode = i; applyMode(); });

function paintButtons() {
  [...lodHost.children].forEach((b, i) => { b.setAttribute('aria-pressed', i === lodIdx); b.disabled = loading; });
  [...visHost.children].forEach((b, i) => { b.setAttribute('aria-pressed', i === visIdx); b.disabled = loading; });
  [...modeHost.children].forEach((b, i) => b.setAttribute('aria-pressed', i === mode));
}

addEventListener('keydown', (e) => {
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.key === '1') { mode = 0; applyMode(); }
  else if (e.key === '2') { mode = 1; applyMode(); }
  else if (e.key === '3') { mode = 2; applyMode(); }
  else if (e.key === 'o' || e.key === 'O') { outlines = !outlines; applyMode(); }
  else if (e.key === '[') { lodIdx = Math.max(0, lodIdx - 1); load(); }
  else if (e.key === ']') { lodIdx = Math.min(LODS.length - 1, lodIdx + 1); load(); }
  else if (e.key === 'a' || e.key === 'A') { visIdx = 1 - visIdx; load(); }
});

// ── Frame ─────────────────────────────────────────────────────────────────
await load(true);

const times = [];
let last = performance.now();
renderer.setAnimationLoop(() => {
  const now = performance.now();
  times.push(now - last); if (times.length > 60) times.shift();
  last = now;
  controls.update();
  renderer.render(scene, camera);

  const ms = times.reduce((a, b) => a + b, 0) / times.length;
  const info = renderer.info.render;
  const meta = current && current.meta;
  hud.textContent = !meta ? 'loading…' :
    `${meta.sector}|${meta.prefab}   ${LODS[lodIdx].label}  ${VIS[visIdx].label}  ${MODES[mode]}\n` +
    `[ ] lod   A placements   1/2/3 draw   O outlines\n\n` +
    `frame      ${ms.toFixed(1)} ms  (${(1000 / ms).toFixed(0)} fps)\n` +
    `draw calls ${info.drawCalls}\n` +
    `triangles  ${info.triangles.toLocaleString()}\n\n` +
    `placements ${meta.placements.toLocaleString()}${meta.droppedNeverVisible ? `, ${meta.droppedNeverVisible.toLocaleString()} dropped as never visible` : ''}\n` +
    `kit        ${meta.uniqueMeshes} meshes, ${meta.uniqueTriangles.toLocaleString()} unique triangles\n` +
    `merged     ${meta.drawnTriangles.toLocaleString()} triangles\n` +
    `boxes      ${meta.hullBoxes.toLocaleString()} (${(meta.hullBoxes * 12).toLocaleString()} triangles)`;
});
</script>
</body>
</html>
